<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main>
      <p class="breadcrumb">Store <span aria-hidden="true">/</span> Checkout</p>
      <section class="order-card" aria-labelledby="order-title">
        <div class="card-header">
          <div>
            <h1 id="order-title">Checkout</h1>
            <p class="card-description">Order #1042</p>
          </div>
          <span id="item-count" class="item-count">2 items</span>
        </div>
        <ul id="items" aria-label="Items in this order"></ul>
        <div class="checkout-bar">
          <span class="payment">Visa ending 4242</span>
          <button id="place-order" type="button">Place order</button>
        </div>
        <div id="confirmation" class="confirmation" hidden>
          <span class="confirmation-mark" aria-hidden="true"></span>
          <p class="confirmation-text">Order placed. Charged <strong id="charged"></strong>.</p>
        </div>
      </section>
    </main>
  </body>
</html>
